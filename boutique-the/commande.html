<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande — Florelle</title>
<meta name="description" content="Finalisez votre commande Florelle.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFE4D1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Florelle">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Commande — Florelle">
<meta property="og:description" content="Finalisez votre commande Florelle.">
<meta property="og:image" content="https://images.unsplash.com/photo-1563822249366-3efb23b8e0c9?auto=format&fit=crop&w=1200&h=630&q=75">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="preload" href="assets/fonts/poppins-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="commande">
<div id="site-entete"></div>
<main id="contenu" tabindex="-1">
<div class="page" id="zone-commande">
  <nav class="etapes fil--decale" aria-label="Étapes de la commande" style="margin:22px 0 0"><span><a href="panier.html">Panier</a></span><span><b>Informations &amp; livraison</b></span><span data-paiement="stripe" hidden>Paiement</span><span data-paiement="demande">Confirmation</span></nav>
  <div class="commande" style="padding-top:20px">
    <form id="form-commande" class="formulaire" novalidate>
      <h1 style="margin:0">Finaliser ma commande</h1>
      <fieldset><legend><span class="num">1</span>Vos coordonnées</legend>
        <div class="champ"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="err-email"><p class="erreur" id="err-email"><span data-icone="alerte"></span><span class="txt"></span></p></div>
        <div class="champ"><label for="telephone">Téléphone <span class="facultatif">(facultatif)</span></label><input id="telephone" name="telephone" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="err-telephone"><p class="erreur" id="err-telephone"><span data-icone="alerte"></span><span class="txt"></span></p></div>
      </fieldset>
      <fieldset><legend><span class="num">2</span>Adresse de livraison</legend>
        <div class="rangee"><div class="champ"><label for="prenom">Prénom</label><input id="prenom" name="prenom" type="text" autocomplete="given-name" required aria-describedby="err-prenom"><p class="erreur" id="err-prenom"><span data-icone="alerte"></span><span class="txt"></span></p></div><div class="champ"><label for="nom">Nom</label><input id="nom" name="nom" type="text" autocomplete="family-name" required aria-describedby="err-nom"><p class="erreur" id="err-nom"><span data-icone="alerte"></span><span class="txt"></span></p></div></div>
        <div class="champ"><label for="adresse">Adresse</label><input id="adresse" name="adresse" type="text" autocomplete="address-line1" required aria-describedby="err-adresse"><p class="erreur" id="err-adresse"><span data-icone="alerte"></span><span class="txt"></span></p></div>
        <div class="champ"><label for="complement">Complément d'adresse <span class="facultatif">(facultatif)</span></label><input id="complement" name="complement" type="text" autocomplete="address-line2" aria-describedby="err-complement"><p class="erreur" id="err-complement"><span data-icone="alerte"></span><span class="txt"></span></p></div>
        <div class="rangee rangee--3"><div class="champ"><label for="cp">Code postal</label><input id="cp" name="cp" type="text" autocomplete="postal-code" required inputmode="numeric" maxlength="5" aria-describedby="err-cp"><p class="erreur" id="err-cp"><span data-icone="alerte"></span><span class="txt"></span></p></div><div class="champ"><label for="ville">Ville</label><input id="ville" name="ville" type="text" autocomplete="address-level2" required aria-describedby="err-ville"><p class="erreur" id="err-ville"><span data-icone="alerte"></span><span class="txt"></span></p></div></div>
        <div class="champ"><label for="pays">Pays</label><select id="pays" name="pays"><option>France métropolitaine</option></select></div>
      </fieldset>
      <fieldset><legend><span class="num">3</span>Mode de livraison</legend>
        <div class="choix-livraison" id="modes-livraison"></div>
      </fieldset>
      <fieldset><legend><span class="num">4</span>Paiement</legend>
        <div id="bloc-paiement"></div>
        <div class="champ"><label for="message">Un mot pour nous <span class="facultatif">(facultatif)</span></label><textarea id="message" name="message" rows="3" placeholder="Un message pour un cadeau, une précision pour la livraison…"></textarea></div>
        <div class="case-cgv"><label class="case"><input type="checkbox" name="cgv" id="cgv" aria-describedby="err-cgv"> <span>J'ai lu et j'accepte les <a href="cgv.html" target="_blank" rel="noopener">conditions générales de vente</a> et la <a href="confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>
          <p class="erreur" id="err-cgv"><span data-icone="alerte"></span><span class="txt"></span></p></div>
      </fieldset>
      <div id="message-commande" role="alert" hidden></div>
      <button type="submit" class="btn btn--plein btn--large" id="btn-commander">Envoyer ma demande de commande</button>
      <p class="discret" style="font-size:13px;margin:0">Vos données servent uniquement à traiter votre commande. <a href="confidentialite.html">En savoir plus</a></p>
    </form>
    <aside class="recap" id="recap" aria-label="Récapitulatif de la commande"></aside>
  </div>
</div>
<form name="commande" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="commande">
  <input name="bot-field"><input name="numero"><input name="email"><input name="telephone"><input name="prenom"><input name="nom">
  <input name="adresse"><input name="livraison"><textarea name="commande"></textarea><input name="total"><textarea name="message"></textarea>
</form>
</main>
<div id="site-pied"></div>
<noscript><p style="padding:16px;text-align:center;background:#FFF6D6">Le panier et la commande nécessitent JavaScript. Pour commander sans, écrivez-nous à bonjour@florelle.fr.</p></noscript>
<script src="assets/js/config.js"></script>
<script src="assets/js/catalogue.js"></script>
<script src="assets/js/illustrations.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
